plugins { id 'java-library' }
dependencies {
    api project(':contracts')
    implementation project(':game-data')
    api 'com.badlogicgames.gdx:gdx:1.14.2'
    // The blackout layout needs five font sizes; the stock bitmap font has one.
    api 'com.badlogicgames.gdx:gdx-freetype:1.14.2'
    // Test-only: the client asserts the field story it draws against the real rules engine (A).
    // Production code must not depend on game-core; the Android client only ever sees PlayerView.
    testImplementation project(':game-core')
}
